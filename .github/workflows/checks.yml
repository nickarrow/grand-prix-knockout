name: Checks

# Run the full check suite on every push to a feature branch. Not on main (main
# is deploy, and nothing gates it today) and not on pull requests (this repo does
# not use them).
on:
  push:
    branches-ignore:
      - main

# Least-privilege: these checks only read the repository.
permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
